name: Android native prototype

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - "docs/ANDROID_NATIVE_MVP.md"
      - "docs/ENGINE_SELECTION.md"
      - "docs/PLATFORM_COMPATIBILITY.md"
      - "shared/smart-connect/web-demo/test_server.py"
      - ".github/workflows/android-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "docs/ANDROID_NATIVE_MVP.md"
      - "docs/ENGINE_SELECTION.md"
      - "docs/PLATFORM_COMPATIBILITY.md"
      - "shared/smart-connect/web-demo/test_server.py"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Test Python prototype and Android VPN acceptance guardrails
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s shared/smart-connect/web-demo -p 'test_*.py' -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch and verify pinned Xray AAR
        run: sh android/fetch-xray-core.sh
      - name: Build native debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: v2speed-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
