name: Android native prototype

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "android/**"
      - "docs/ANDROID_NATIVE_MVP.md"
      - "docs/ENGINE_SELECTION.md"
      - "docs/PLATFORM_COMPATIBILITY.md"
      - "shared/smart-connect/web-demo/test_server.py"
      - ".github/workflows/android-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "docs/ANDROID_NATIVE_MVP.md"
      - "docs/ENGINE_SELECTION.md"
      - "docs/PLATFORM_COMPATIBILITY.md"
      - "shared/smart-connect/web-demo/test_server.py"
      - ".github/workflows/android-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test Python prototype and Android VPN acceptance guardrails
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s shared/smart-connect/web-demo -p 'test_*.py' -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Fetch and verify pinned Xray AAR
        run: sh android/fetch-xray-core.sh
      - name: Build native debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          gradle --no-daemon --console=plain --stacktrace :app:testDebugUnitTest :app:assembleDebug > "$RUNNER_TEMP/android-build.log" 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            echo '### Android Gradle failure excerpt' >> "$GITHUB_STEP_SUMMARY"
            {
              grep -E '^(e: file:|FAILURE:)' "$RUNNER_TEMP/android-build.log" || true
              awk '/^FAILURE:/{capture=1} capture && count++ < 18 {print}' "$RUNNER_TEMP/android-build.log"
            } | head -n 24 | tee -a "$GITHUB_STEP_SUMMARY" | while IFS= read -r line; do
              printf '::error title=Gradle root cause::%s\n' "$line"
            done
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        with:
          name: v2speed-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
